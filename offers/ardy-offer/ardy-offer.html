<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="../../assets/js/auth.js?v=12.0.1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عروض WE - المصرية للاتصالات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="../../assets/js/active-users-widget.js?v=cv1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans','Cairo','Tajawal',sans-serif;
            background: linear-gradient(135deg, var(--cv-canvas) 0%, var(--cv-canvas) 50%, var(--cv-canvas) 100%);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            position: relative;
            background: linear-gradient(135deg, #7048d8 0%, #8a62f0 100%);
            color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(112,72,216,0.45);
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .back-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--cv-white-ink);
            text-decoration: none;
            font-size: 20px;
            z-index: 10;
            opacity: 0.9;
            transition: opacity 0.2s;
        }

        .back-btn:hover {
            opacity: 1;
        }

        .offers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .offer-card {
            background: var(--cv-card);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(112,72,216,0.2);
            border: 2px solid rgba(157,114,255,0.22);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .offer-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(112,72,216,0.36);
        }

        .offer-header {
            background: linear-gradient(135deg, #7048d8 0%, #8a62f0 100%);
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }

        .offer-badge {
            background: rgba(var(--cv-wash),0.2);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .offer-body {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .offer-highlight {
            background: linear-gradient(135deg, rgba(224,196,82,0.16) 0%, rgba(224,196,82,0.24) 100%);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            border: 2px solid #fbbf24;
        }

        .offer-highlight p {
            color: #f4a97b;
            font-size: 1.2em;
            font-weight: bold;
        }

        .offer-details {
            color: var(--cv-accent-ink);
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .offer-details ul {
            list-style: none;
            padding: 0;
        }

        .offer-details li {
            padding: 8px 0;
            padding-right: 25px;
            position: relative;
            font-size: 0.95em;
        }

        .offer-details li::before {
            content: "✓";
            position: absolute;
            right: 0;
            color: var(--cv-accent-ink);
            font-weight: bold;
        }

        .offer-button {
            display: block;
            background: linear-gradient(135deg, #7048d8 0%, #8a62f0 100%);
            color: #ffffff;
            text-align: center;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
        }

        .offer-button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(112,72,216,0.45);
        }

        .no-offers {
            background: var(--cv-card);
            padding: 60px 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(112,72,216,0.2);
            border: 2px solid rgba(157,114,255,0.22);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--cv-accent-ink);
            font-size: 0.95em;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 1.8em; }
            .offers-grid { grid-template-columns: 1fr; }
        }
    
/* cv-light-islands */
:root[data-theme="light"] header,
:root[data-theme="light"] .offer-header,
:root[data-theme="light"] .offer-button{--cv-canvas:#0D0A1C;--cv-deep:#120E28;--cv-card:#1D1643;--cv-raised:#28205C;--cv-raised2:#33297A;--cv-text:#F8F6FF;--cv-white-ink:#FFFFFF;--cv-ink-soft:#E6DFF9;--cv-ink-soft2:#CBC3D6;--cv-muted:#9E97C2;--cv-accent-ink:#CEBDFF;--cv-wash:255,255,255}
/* /cv-light-islands */
</style>
<meta name="theme-color" content="#0D0A1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="../../assets/js/theme-init.js?v=2"></script>
<link rel="stylesheet" href="../../assets/css/cognitive-violet.css?v=3">
<script src="../../assets/js/back-button.js?v=1" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎁 عروض WE</h1>
            <p>احصل على أفضل العروض والخصومات من المصرية للاتصالات</p>
        </header>

        <div id="offersContainer"></div>

        <div id="noOffersMessage" class="no-offers" style="display: none;">
            <i class="fas fa-gift" style="font-size: 4em; color: var(--cv-accent-ink); margin-bottom: 20px; opacity: 0.5;"></i>
            <h2>لا توجد عروض حالياً</h2>
            <p>نعمل على تقديم عروض جديدة ومميزة لك قريباً</p>
        </div>

        <footer>WE Core Team 2026</footer>
    </div>

    <script>
        // مصفوفة العروض
        const offers = [
            {
                title: "ِArdy",
                badge: "عرض خاص",
                highlight: "",
                details: [
                ],
                buttonText: "تفاصيل أكثر",
                buttonLink: "we-summer-offer.html"
            }
        ];

        function displayOffers() {
            const container = document.getElementById('offersContainer');
            const noOffers = document.getElementById('noOffersMessage');

            if (!offers || offers.length === 0) {
                container.innerHTML = '';
                noOffers.style.display = 'block';
                return;
            }

            noOffers.style.display = 'none';

            let html = '<div class="offers-grid">';
            offers.forEach(offer => {
                const detailsHtml = (offer.details && offer.details.length)
                    ? offer.details.map(d => `<li>${d}</li>`).join('')
                    : '<li>التفاصيل الكاملة متاحة عبر صفحة العرض</li>';

                html += `
                    <div class="offer-card">
                        <div class="offer-header">
                            <h3>${offer.title}</h3>
                            <span class="offer-badge">${offer.badge}</span>
                        </div>
                        <div class="offer-body">
                            <div class="offer-highlight">
                                <p>🎁 ${offer.highlight}</p>
                            </div>
                            <div class="offer-details">
                                <ul>
                                    ${detailsHtml}
                                </ul>
                            </div>
                            <a href="${offer.buttonLink}" class="offer-button">
                                <i class="fas fa-arrow-left"></i> ${offer.buttonText}
                            </a>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        window.addEventListener('load', displayOffers);

        // Widget Initialization
        window.addEventListener('load', function() {
            if (typeof ActiveUsersWidget !== 'undefined') {
                ActiveUsersWidget.init({ position: 'corner' });
            }
        });
    </script>
</body>
</html>
