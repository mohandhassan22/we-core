<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<body data-page="index">

                <div class="sidebar-brand-logo"><i class="fa-solid fa-bullseye"></i></div>

                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer">
                <button class="btn btn-secondary w-full" id="darkToggleBtn" type="button">

                </div>
                <div class="header-right">
                    <div class="user-badge">

                    </div>
                </div>

            <div class="dashboard-content" id="mainDashboardContent">
                <div id="stateHost"><div class="empty-state"><i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;color:var(--we-purple);"></i><h3>جاري تحويلك للوحة المناسبة...</h3></div></div>
            </div>
        </main>
    </div>

    <script src="js/target-calculator.js"></script>
