<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="../../assets/js/auth.js?v=16.0.3"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الأداء | WE Target Manager</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="agent">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand-logo"><i class="fa-solid fa-bullseye"></i></div>
                <div>
                    <div class="sidebar-title">WE Target Manager</div>
                    <div class="sidebar-sub">لوحة أداء الموظف</div>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer">
                <button class="btn btn-secondary w-full" id="darkToggleBtn" type="button">
                    <i class="fa-solid fa-moon" id="darkToggleIcon"></i> <span>الوضع الداكن</span>
                </button>
            </div>
        </aside>
        <div class="sidebar-overlay"></div>

        <main class="main-wrapper">
            <header class="top-navbar">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
                    <nav class="breadcrumbs" id="breadcrumbsNav">
                        <span class="breadcrumb-item"><i class="fa-solid fa-house"></i> الرئيسية</span>
                        <span class="breadcrumb-separator"><i class="fa-solid fa-chevron-left"></i></span>
                        <span class="breadcrumb-item active">لوحة الأداء</span>
                    </nav>
                </div>
                <div class="header-right">
                    <div class="user-badge">
                        <div class="user-avatar" id="headerUserAvatar">WE</div>
                        <div class="user-info-text">
                            <span class="user-name-str" id="headerUserName">جاري التحميل...</span>
                            <span class="user-role-tag" id="headerUserRole">—</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="dashboard-content" id="mainDashboardContent">
                <section class="dashboard-hero">
                    <div>
                        <h1 class="hero-title" id="heroTitle">لوحة الأداء</h1>
                        <p class="hero-subtitle" id="heroSubtitle"></p>
                    </div>
                    <div class="hero-actions" id="heroActions"></div>
                </section>
                <div id="stateHost" style="display:none;"></div>
                <div id="pageBody">
                    <section class="kpi-grid" id="kpiGridContainer">
                        <div class="skeleton" style="height:120px;"></div>
                        <div class="skeleton" style="height:120px;"></div>
                        <div class="skeleton" style="height:120px;"></div>
                        <div class="skeleton" style="height:120px;"></div>
                        <div class="skeleton" style="height:120px;"></div>
                        <div class="skeleton" style="height:120px;"></div>
                    </section>
                    <section id="items-section">
                        <h3 class="font-bold" style="font-size:1.15rem;margin-bottom:1rem;">
                            <i class="fa-solid fa-layer-group" style="color:var(--we-purple);"></i> الأداء حسب المنتج
                        </h3>
                        <div class="items-grid" id="itemsGridContainer">
                        <div class="skeleton" style="height:100px;"></div>
                        <div class="skeleton" style="height:100px;"></div>
                        <div class="skeleton" style="height:100px;"></div>
                        </div>
                    </section>
                    <section class="charts-grid">
                        <div class="chart-card">
                            <div class="chart-header"><h4 class="chart-title"><i class="fa-solid fa-chart-column"></i> الهدف vs المحقق</h4></div>
                            <div class="chart-container"><canvas id="chartTargetVsAchieve"></canvas></div>
                        </div>
                        <div class="chart-card" id="daily-section">
                            <div class="chart-header"><h4 class="chart-title"><i class="fa-solid fa-chart-line"></i> الأداء اليومي</h4></div>
                            <div class="chart-container"><canvas id="chartDailyTrend"></canvas></div>
                        </div>
                        <div class="chart-card">
                            <div class="chart-header"><h4 class="chart-title"><i class="fa-solid fa-layer-group"></i> تحقيق كل منتج</h4></div>
                            <div class="chart-container"><canvas id="chartItems"></canvas></div>
                        </div>
                        <div class="chart-card">
                            <div class="chart-header"><h4 class="chart-title"><i class="fa-solid fa-arrow-trend-up"></i> المتوقع vs الهدف</h4></div>
                            <div class="chart-container"><canvas id="chartProjection"></canvas></div>
                        </div>
                        <div class="chart-card">
                            <div class="chart-header"><h4 class="chart-title"><i class="fa-solid fa-chart-pie"></i> توزيع المنتجات</h4></div>
                            <div class="chart-container"><canvas id="chartProductBreakdown"></canvas></div>
                        </div>
                    </section>
                    <section class="ai-coach-card" id="ai-section">
                        <div class="ai-coach-header">
                            <span class="ai-badge"><i class="fa-solid fa-wand-magic-sparkles"></i> WE AI Coach</span>
                            <button class="btn btn-sm btn-secondary" type="button" onclick="Dashboard.loadAiCoach()"><i class="fa-solid fa-rotate"></i> تحديث التحليل</button>
                        </div>
                        <div class="ai-content-box" id="aiCoachText">جاري التحليل...</div>
                    </section>
                </div>
            </div>
        </main>
    </div>
    <div class="modal-overlay" id="dailyModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fa-solid fa-calendar-plus"></i> تسجيل الأداء اليومي</h3>
                <button class="btn-icon" type="button" onclick="Utils.closeModal('dailyModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">التاريخ (داخل فترة الـ Target)</label>
                    <input type="date" class="form-input" id="entryDate" required>
                </div>
                <div class="items-grid" style="grid-template-columns: repeat(2, 1fr);">
                    <div class="form-group"><label class="form-label">PT12</label><input type="number" min="0" class="form-input" id="entry_pt12" value="0"></div>
                    <div class="form-group"><label class="form-label">Super Kix</label><input type="number" min="0" class="form-input" id="entry_super_kix" value="0"></div>
                    <div class="form-group"><label class="form-label">New Control Tazbeet</label><input type="number" min="0" class="form-input" id="entry_tazbeet" value="0"></div>
                    <div class="form-group"><label class="form-label">Data</label><input type="number" min="0" class="form-input" id="entry_data" value="0"></div>
                    <div class="form-group"><label class="form-label">ADSL</label><input type="number" min="0" class="form-input" id="entry_adsl" value="0"></div>
                    <div class="form-group"><label class="form-label">Fixed</label><input type="number" min="0" class="form-input" id="entry_fixed" value="0"></div>
                    <div class="form-group" style="grid-column: span 2;"><label class="form-label">WE Pay</label><input type="number" min="0" class="form-input" id="entry_we_pay" value="0"></div>
                </div>
                <div class="form-group" style="margin-top:1rem;">
                    <label class="form-label">ملاحظات (اختياري)</label>
                    <input type="text" class="form-input" id="entryNotes" maxlength="200">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" onclick="Utils.closeModal('dailyModal')">إلغاء</button>
                <button class="btn btn-primary" type="button" id="saveDailyBtn"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
            </div>
        </div>
    </div>
    <script src="../js/target-calculator.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/permissions.js"></script>
    <script src="../js/charts.js"></script>
    <script src="../js/ai.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>
