<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="../../assets/js/auth.js?v=16.0.3"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإعدادات | WE Target Manager</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/polish.css">
</head>
<body data-page="settings">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand-logo"><i class="fa-solid fa-bullseye"></i></div>
                <div>
                    <div class="sidebar-title">WE Target Manager</div>
                    <div class="sidebar-sub">الإعدادات</div>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer">
                <button class="btn btn-secondary w-full" id="darkToggleBtn" type="button">
                    <i class="fa-solid fa-moon" id="darkToggleIcon"></i> <span>الوضع الداكن</span>
                </button>
            </div>
        </aside>
        <div class="sidebar-overlay"></div>

        <main class="main-wrapper">
            <header class="top-navbar">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
                    <nav class="breadcrumbs" id="breadcrumbsNav">
                        <span class="breadcrumb-item"><i class="fa-solid fa-house"></i> الرئيسية</span>
                        <span class="breadcrumb-separator"><i class="fa-solid fa-chevron-left"></i></span>
                        <span class="breadcrumb-item active">الإعدادات</span>
                    </nav>
                </div>
                <div class="header-right">
                    <div class="user-badge">
                        <div class="user-avatar" id="headerUserAvatar">WE</div>
                        <div class="user-info-text">
                            <span class="user-name-str" id="headerUserName">جاري التحميل...</span>
                            <span class="user-role-tag" id="headerUserRole">—</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="dashboard-content" id="mainDashboardContent">
                <section class="dashboard-hero">
                    <div>
                        <h1 class="hero-title" id="heroTitle">الإعدادات</h1>
                        <p class="hero-subtitle" id="heroSubtitle"></p>
                    </div>
                    <div class="hero-actions" id="heroActions"></div>
                </section>
                <div id="stateHost" style="display:none;"></div>
                <div id="pageBody">
                    <div class="glass-card" style="padding:1.5rem;max-width:640px;">
                        <h3 class="font-bold" style="margin-bottom:1rem;"><i class="fa-solid fa-user"></i> الملف الشخصي</h3>
                        <div class="form-group"><label class="form-label">الاسم</label><input class="form-input" id="setName" maxlength="80"></div>
                        <div class="form-group"><label class="form-label">اسم المستخدم</label><input class="form-input" id="setUser" disabled></div>
                        <div class="form-group"><label class="form-label">الدور</label><input class="form-input" id="setRole" disabled></div>
                        <div class="form-group"><label class="form-label">الفرع / المنطقة</label><input class="form-input" id="setScope" disabled></div>
                        <button class="btn btn-primary" id="saveName" type="button"><i class="fa-solid fa-floppy-disk"></i> حفظ الاسم</button>
                    </div>
                    <div class="glass-card" style="padding:1.5rem;max-width:640px;margin-top:1rem;">
                        <h3 class="font-bold" style="margin-bottom:1rem;"><i class="fa-solid fa-palette"></i> المظهر</h3>
                        <div class="flex gap-2" id="themeBtns">
                            <button class="btn btn-secondary" data-t="light" type="button">فاتح</button>
                            <button class="btn btn-secondary" data-t="dark" type="button">داكن</button>
                            <button class="btn btn-secondary" data-t="system" type="button">حسب الجهاز</button>
                        </div>
                        <p class="text-muted" style="font-size:.8rem;margin-top:.75rem;">يُحفظ التفضيل على جهازك فقط. بيانات الأداء لا تُحفظ محليًا.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/target-calculator.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/permissions.js"></script>
    <script src="../js/charts.js"></script>
    <script src="../js/ai.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/app.js"></script>
    <script>
    window.PageModules = window.PageModules || {};
    window.PageModules.settings = async function (ctx) {
        var $ = function (id) { return document.getElementById(id); }, p = ctx.profile;
        $('heroTitle').textContent = 'الإعدادات'; $('heroSubtitle').textContent = Permissions.getRoleConfig(ctx.role).title;
        $('setName').value = p.full_name || ''; $('setUser').value = p.username || '';
        $('setRole').value = Permissions.getRoleConfig(ctx.role).title;
        var b = ctx.myBranch ? ctx.myBranch.name : '—', a = ctx.managedAreas.length ? ctx.managedAreas.map(function (x) { return x.name; }).join('، ') : '—';
        $('setScope').value = b + ' / ' + a;
        $('saveName').onclick = async function () {
            var v = $('setName').value.trim(); if (!v) return Utils.showToast('الاسم مطلوب', 'error');
            try { await TargetAPI.updateMyName(ctx.userId, v); Utils.showToast('تم حفظ الاسم', 'success'); $('headerUserName').textContent = v; }
            catch (e) { Utils.showToast('لم يتم الحفظ: ' + e.message, 'error'); }
        };
        function mark() { document.querySelectorAll('#themeBtns [data-t]').forEach(function (x) { x.classList.toggle('btn-primary', x.getAttribute('data-t') === Utils.getTheme()); x.classList.toggle('btn-secondary', x.getAttribute('data-t') !== Utils.getTheme()); }); }
        document.querySelectorAll('#themeBtns [data-t]').forEach(function (x) { x.onclick = function () { Utils.setTheme(x.getAttribute('data-t')); mark(); }; });
        mark();
    };
    </script>
</body>
</html>
