<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="../../assets/js/auth.js?v=16.0.3"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأداء اليومي | WE Target Manager</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="performance">
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand-logo"><i class="fa-solid fa-bullseye"></i></div>
                <div>
                    <div class="sidebar-title">WE Target Manager</div>
                    <div class="sidebar-sub">الأداء اليومي</div>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer">
                <button class="btn btn-secondary w-full" id="darkToggleBtn" type="button">
                    <i class="fa-solid fa-moon" id="darkToggleIcon"></i> <span>الوضع الداكن</span>
                </button>
            </div>
        </aside>
        <div class="sidebar-overlay"></div>

        <main class="main-wrapper">
            <header class="top-navbar">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
                    <nav class="breadcrumbs" id="breadcrumbsNav">
                        <span class="breadcrumb-item"><i class="fa-solid fa-house"></i> الرئيسية</span>
                        <span class="breadcrumb-separator"><i class="fa-solid fa-chevron-left"></i></span>
                        <span class="breadcrumb-item active">الأداء اليومي</span>
                    </nav>
                </div>
                <div class="header-right">
                    <div class="user-badge">
                        <div class="user-avatar" id="headerUserAvatar">WE</div>
                        <div class="user-info-text">
                            <span class="user-name-str" id="headerUserName">جاري التحميل...</span>
                            <span class="user-role-tag" id="headerUserRole">—</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="dashboard-content" id="mainDashboardContent">
                <section class="dashboard-hero">
                    <div>
                        <h1 class="hero-title" id="heroTitle">الأداء اليومي</h1>
                        <p class="hero-subtitle" id="heroSubtitle"></p>
                    </div>
                    <div class="hero-actions" id="heroActions"></div>
                </section>
                <div id="stateHost" style="display:none;"></div>
                <div id="pageBody">
                    <div class="table-card-wrapper">
                        <div class="table-toolbar"><h3 class="font-bold">سجل الأداء اليومي</h3></div>
                        <div class="data-table-container">
                            <table class="data-table">
                                <thead><tr><th>التاريخ</th><th>PT12</th><th>Super Kix</th><th>Tazbeet</th><th>Data</th><th>إجمالي الخطوط</th><th>ADSL</th><th>Fixed</th><th>WE Pay</th><th>ملاحظات</th><th></th></tr></thead>
                                <tbody id="perfBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="modal-overlay" id="dailyModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fa-solid fa-calendar-plus"></i> تسجيل الأداء اليومي</h3>
                <button class="btn-icon" type="button" onclick="Utils.closeModal('dailyModal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">التاريخ (داخل فترة الـ Target)</label>
                    <input type="date" class="form-input" id="entryDate" required>
                </div>
                <div class="items-grid" style="grid-template-columns: repeat(2, 1fr);">
                    <div class="form-group"><label class="form-label">PT12</label><input type="number" min="0" class="form-input" id="entry_pt12" value="0"></div>
                    <div class="form-group"><label class="form-label">Super Kix</label><input type="number" min="0" class="form-input" id="entry_super_kix" value="0"></div>
                    <div class="form-group"><label class="form-label">New Control Tazbeet</label><input type="number" min="0" class="form-input" id="entry_tazbeet" value="0"></div>
                    <div class="form-group"><label class="form-label">Data</label><input type="number" min="0" class="form-input" id="entry_data" value="0"></div>
                    <div class="form-group"><label class="form-label">ADSL</label><input type="number" min="0" class="form-input" id="entry_adsl" value="0"></div>
                    <div class="form-group"><label class="form-label">Fixed</label><input type="number" min="0" class="form-input" id="entry_fixed" value="0"></div>
                    <div class="form-group" style="grid-column: span 2;"><label class="form-label">WE Pay</label><input type="number" min="0" class="form-input" id="entry_we_pay" value="0"></div>
                </div>
                <div class="form-group" style="margin-top:1rem;">
                    <label class="form-label">ملاحظات (اختياري)</label>
                    <input type="text" class="form-input" id="entryNotes" maxlength="200">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" onclick="Utils.closeModal('dailyModal')">إلغاء</button>
                <button class="btn btn-primary" type="button" id="saveDailyBtn"><i class="fa-solid fa-floppy-disk"></i> حفظ</button>
            </div>
        </div>
    </div>
    <script src="../js/target-calculator.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/permissions.js"></script>
    <script src="../js/charts.js"></script>
    <script src="../js/ai.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/app.js"></script>
    <script>
    window.PageModules = window.PageModules || {};
    window.PageModules.performance = async function (ctx) {
        var $ = function (id) { return document.getElementById(id); }, esc = Utils.esc, ITEMS = TargetAPI.ITEMS;
        var cur = Utils.getCurrentMonthYear(), state = { month: cur.month, year: cur.year, period: null, logs: [] };

        function hero() {
            $('heroTitle').textContent = 'الأداء اليومي';
            $('heroSubtitle').textContent = Utils.monthLabel(state.month, state.year);
            $('heroActions').innerHTML = state.period ? '<button class="btn btn-primary" id="addBtn" type="button"><i class="fa-solid fa-plus-circle"></i> إضافة أداء اليوم</button>' : '';
            var b = $('addBtn'); if (b) b.onclick = function () { openModal(null); };
        }
        function openModal(row) {
            var inp = $('entryDate'), p = state.period, t = Utils.todayCairo();
            inp.min = p.start_date; inp.max = p.end_date;
            inp.value = row ? row.performance_date : (t < p.start_date ? p.start_date : (t > p.end_date ? p.end_date : t));
            ITEMS.forEach(function (k) { $('entry_' + k).value = row ? row[k] : 0; });
            $('entryNotes').value = row && row.notes ? row.notes : '';
            Utils.openModal('dailyModal');
        }
        async function load() {
            var d;
            try { d = await TargetAPI.dashboard({ view: 'me', month: state.month, year: state.year }); }
            catch (e) { $('stateHost').style.display = ''; $('pageBody').style.display = 'none'; $('stateHost').innerHTML = '<div class="empty-state"><h3>' + esc(e.message) + '</h3></div>'; return; }
            state.period = d.hasPeriod ? d.period : null;
            hero();
            if (!state.period) {
                $('pageBody').style.display = 'none'; $('stateHost').style.display = '';
                $('stateHost').innerHTML = '<div class="empty-state"><i class="fa-solid fa-bullseye" style="font-size:2.2rem;color:var(--we-purple);"></i><h3>لا يوجد Target لشهر ' + esc(Utils.monthLabel(state.month, state.year)) + '</h3><p class="text-muted">يحدده مدير الفرع. بعدها تقدر تسجل أداءك هنا.</p></div>';
                return;
            }
            $('stateHost').style.display = 'none'; $('pageBody').style.display = '';
            state.logs = await TargetAPI.fetchDailyLogs(state.period.id, ctx.userId);
            $('perfBody').innerHTML = state.logs.length ? state.logs.map(function (r, i) {
                var lines = TargetCalculator.calculateTotalLinesAchieve(r);
                return '<tr><td>' + esc(r.performance_date) + '</td><td>' + r.pt12 + '</td><td>' + r.super_kix + '</td><td>' + r.tazbeet + '</td><td>' + r.data + '</td><td class="font-bold">' + lines + '</td><td>' + r.adsl + '</td><td>' + r.fixed + '</td><td>' + r.we_pay + '</td><td>' + esc(r.notes || '') + '</td>'
                    + '<td><button class="btn btn-sm btn-secondary" type="button" data-i="' + i + '"><i class="fa-solid fa-pen"></i></button></td></tr>';
            }).join('') : '<tr><td colspan="11" class="text-center text-muted">لم تسجل أي أداء في هذه الفترة بعد</td></tr>';
            $('perfBody').querySelectorAll('button[data-i]').forEach(function (b) { b.onclick = function () { openModal(state.logs[Number(b.getAttribute('data-i'))]); }; });
        }
        $('saveDailyBtn').onclick = async function () {
            var items = {}; ITEMS.forEach(function (k) { items[k] = $('entry_' + k).value; });
            var btn = this; btn.disabled = true;
            try {
                await TargetAPI.saveDailyPerformance(state.period.id, ctx.userId, $('entryDate').value, items, $('entryNotes').value);
                Utils.showToast('تم حفظ الأداء', 'success'); Utils.closeModal('dailyModal'); await load();
            } catch (e) { Utils.showToast('لم يتم الحفظ: ' + e.message, 'error'); } finally { btn.disabled = false; }
        };
        await load();
    };
    </script>
</body>
</html>
