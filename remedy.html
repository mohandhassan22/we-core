<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script src="assets/js/auth.js?v=12.0.1"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Remedy Guide – Telecom Egypt</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/remedy.css" />
    <script src="assets/js/active-users-widget.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="hdr">
        <div class="hdr-left">
          <a href="javascript:history.back()" class="back-btn" aria-label="رجوع">
            <i class="fas fa-arrow-right"></i>
          </a>
          <a href="index.html" class="brand">
            <div class="brand-ico">R</div>
            <div class="brand-text">
              <div class="brand-name">REMEDY GUIDE</div>
              <div class="brand-sub">WE-Core</div>
            </div>
          </a>
        </div>
        <div class="nav-links">
          <a href="index.html">
            <i class="fa-solid fa-house-user"></i>
            الرئيسية
          </a>
        </div>
      </div>
    </header>

    <main>
      <div class="hero">
        <h1>دليل مسارات <span>Remedy</span></h1>
        <p>تصفح وابحث في كافة المسارات المتاحة على السيستم</p>
      </div>

      <div class="status-bar" id="status-bar">
        <span class="status-dot"></span>
        <span id="status-text">جاري التحقق من الجلسة...</span>
      </div>

      <div class="search-area">
        <span class="search-ico">🔍</span>
        <input
          id="srch"
          type="text"
          placeholder="ابحث باسم المشكلة، المسار، أو الوصف..."
          oninput="doSearch()"
        />
      </div>

      <div class="grid" id="grid"></div>
      <div id="empty">
        <div class="empty-title">لا توجد نتائج</div>
        <div>لم يتم العثور على نتائج تطابق بحثك</div>
      </div>
    </main>

    <div class="overlay" id="overlay" onclick="closePanel()">
      <div class="panel" onclick="event.stopPropagation()">
        <div class="panel-hdr">
          <div class="panel-title" id="p-title"></div>
          <div class="panel-path" id="p-path"></div>
          <button class="close-btn" onclick="closePanel()">✕</button>
        </div>
        <div class="panel-body">
          <div class="info-sec">
            <span class="info-label">وصف المشكلة (Template)</span>
            <div class="info-content" id="p-desc"></div>
          </div>
          <div class="info-sec">
            <span class="info-label">الإجراء المطلوب (Action)</span>
            <div class="info-content action-box" id="p-action"></div>
          </div>
          <div class="info-sec" id="sla-sec">
            <span class="info-label">SLA</span>
            <div class="info-content" id="p-sla"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/js/remedy.js"></script>
    <script src="assets/js/remedy_1.js"></script>

    <footer class="site-footer">WE Core Team 2026</footer>
  </body>
</html>
